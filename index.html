<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maybe Never ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffe0e6; /* Soft Romantic Pink */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            perspective: 1000px;
            position: relative;
        }


        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 10, 0.95); /* Dark cinematic layer for anticipation */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            transition: opacity 1s ease;
        }

        .enter-btn {
            background: transparent;
            color: #ff007f;
            border: 2px solid #ff007f;
            padding: 15px 35px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 15px #ff007f;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .enter-btn:hover {
            background: #ff007f;
            color: #fff;
            box-shadow: 0 0 35px #ff007f, 0 0 60px #ff007f;
        }

    
        .main-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1.5s ease-in;
            position: relative;
            z-index: 2; /* Rain er upore content thakbe */
        }

     
        @keyframes neonGlow {
            0%, 100% {
                box-shadow: 0 0 20px #00f0ff, 0 0 40px #00f0ff, inset 0 0 10px #00f0ff;
                transform: scale(1) rotate(0deg);
            }
            33% {
                box-shadow: 0 0 15px #ff007f, 0 0 30px #ff007f, inset 0 0 8px #ff007f;
                transform: scale(1.02) rotate(0.5deg);
            }
            66% {
                box-shadow: 0 0 25px #7b00ff, 0 0 50px #7b00ff, inset 0 0 12px #7b00ff;
                transform: scale(0.99) rotate(-0.5deg);
            }
        }

        @keyframes sideNeonGlow {
            0%, 100% {
                box-shadow: 0 0 15px #ff007f, 0 0 30px #ff007f;
                transform: translateY(0) scale(1);
            }
            50% {
                box-shadow: 0 0 25px #00f0ff, 0 0 45px #00f0ff;
                transform: translateY(-10px) scale(1.03);
            }
        }


        .gallery-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            position: relative;
            max-width: 900px;
            width: 100%;
            padding: 20px;
        }

        .image-box {
            overflow: hidden;
            background-size: cover;
            background-position: center;
            transition: all 0.5s ease;
        }

       
        .parent-img {
            width: 320px;
            height: 420px;
            border-radius: 20px;
            border: 3px solid #fff;
            animation: neonGlow 1.5s infinite alternate ease-in-out;
            z-index: 2;
        }


        .side-img {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 3px solid #fff;
            animation: sideNeonGlow 2s infinite ease-in-out;
            z-index: 1;
        }

        .left-img {
            animation-delay: 0.5s;
        }

 
        .rain {
            position: absolute;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .rain.back-row {
            display: none;
            z-index: 0;
            opacity: 0.5;
        }

        body.back-row-toggle .rain.back-row {
            display: block;
        }

        .drop {
            position: absolute;
            bottom: 100%;
            width: 15px;
            height: 120px;
            animation: drop 0.5s linear infinite;
        }

        @keyframes drop {
            0% { transform: translateY(0vh); }
            100% { transform: translateY(105vh); }
        }

        .stem {
            width: 1.5px;
            height: 60%;
            margin-left: 7px;
            /* Pinkish Rain Drop Vibe */
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0), rgba(255, 0, 127, 0.35));
        }
    </style>
</head>
<body class="back-row-toggle">

  
    <div class="rain front-row"></div>
    <div class="rain back-row"></div>

  
    <div id="welcome-screen">
        <button class="enter-btn" onclick="startSurprise()">Open with Left-hand❤️</button>
    </div>


    <audio id="bg-music" loop>
        <source src="Neelaa.mp3" type="audio/mpeg">
    </audio>


    <div class="main-container" id="main-content">
        <div class="gallery-wrapper">
            
 
            <div class="image-box side-img left-img" style="background-image: url('monk2.jpeg');"></div>
            
  
            <div class="image-box parent-img" style="background-image: url('monk.jpeg');"></div>
            

            <div class="image-box side-img right-img" style="background-image: url('monk1.jpeg');"></div>
            
        </div>
    </div>

    <script>
        function startSurprise() {
       
            const music = document.getElementById('bg-music');
            music.play().catch(error => console.log("Audio play failed:", error));

       
            const welcome = document.getElementById('welcome-screen');
            welcome.style.opacity = '0';
            setTimeout(() => {
                welcome.style.display = 'none';
            }, 1000);

          
            const mainContent = document.getElementById('main-content');
            mainContent.style.display = 'flex';
            setTimeout(() => {
                mainContent.style.opacity = '1';
            }, 100);
        }

       
        var makeItRain = function() {
            document.querySelectorAll('.rain').forEach(el => el.innerHTML = '');
            var increment = 0;
            var drops = "";
            var backDrops = "";

            while (increment < 100) {
                var randoHund = (Math.floor(Math.random() * (98 - 1 + 1) + 1));
                var randoFivo = (Math.floor(Math.random() * (5 - 2 + 1) + 2));
                increment += randoFivo;
                
                drops += '<div class="drop" style="left: ' + increment + '%; bottom: ' + (randoFivo + randoFivo - 1 + 100) + '%; animation-delay: 0.' + randoHund + 's; animation-duration: 0.6' + randoHund + 's;"><div class="stem"></div></div>';
                backDrops += '<div class="drop" style="right: ' + increment + '%; bottom: ' + (randoFivo + randoFivo - 1 + 100) + '%; animation-delay: 0.' + randoHund + 's; animation-duration: 0.6' + randoHund + 's;"><div class="stem"></div></div>';
            }

            document.querySelector('.rain.front-row').innerHTML = drops;
            document.querySelector('.rain.back-row').innerHTML = backDrops;
        }

        makeItRain();
    </script>
</body>
</html>
